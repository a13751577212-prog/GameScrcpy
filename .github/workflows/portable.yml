name: Portable package

on:
  push:
    branches: ["mod/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Windows portable zip
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      QSG_RHI_PREFER_SOFTWARE_RENDERER: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Reuse the Windows build
        uses: actions/cache@v4
        with:
          path: build/ci
          key: win-ci-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt', 'cmake/**', 'src/**/*.cpp', 'src/**/*.h', 'src/**/*.qml') }}-v1
          restore-keys: |
            win-ci-${{ runner.os }}-

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtshadertools
          cache: true

      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Java for the phone side
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Reuse Gradle downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}-v1
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build phone side APKs
        working-directory: android
        shell: pwsh
        run: .\gradlew.bat build --continue --console=plain

      - name: Configure the Windows client
        shell: pwsh
        run: |
          $env:GS_QT_DIR = $env:QT_ROOT_DIR
          cmake --preset ci

      - name: Build the Windows client
        shell: pwsh
        run: cmake --build --preset ci

      - name: Run unit tests
        shell: pwsh
        continue-on-error: true
        run: ctest --preset ci --output-on-failure

      - name: QML lint
        shell: pwsh
        run: |
          $out = cmake --build --preset ci --target all_qmllint 2>&1
          $out
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Pack the portable zip
        shell: pwsh
        run: .\tools\package.ps1 -NoSetup -BuildDir build\ci

      - name: Upload the portable zip
        uses: actions/upload-artifact@v4
        with:
          name: GameScrcpy-portable
          path: dist/*portable.zip
          if-no-files-found: error
          retention-days: 30

      - name: Pack the small update patch
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter GameScrcpy.exe -Recurse -File | Select-Object -First 1
          if (-not $exe) { throw "GameScrcpy.exe not found in dist" }
          Compress-Archive -LiteralPath $exe.FullName -DestinationPath dist\GameScrcpy-update-patch.zip -Force
          Write-Host ("update patch packed from " + $exe.FullName)

      - name: Upload the small update patch
        uses: actions/upload-artifact@v4
        with:
          name: GameScrcpy-update-patch
          path: dist/GameScrcpy-update-patch.zip
          if-no-files-found: error
          retention-days: 30
